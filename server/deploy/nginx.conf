# Kelnix telemetry — nginx vhost.
#
# Install to /etc/nginx/sites-available/kelnix-telemetry, symlink into
# sites-enabled, then let certbot add TLS:
#
#   ln -s /etc/nginx/sites-available/kelnix-telemetry /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d telemetry.kelnix.org
#
# Requires an A record for telemetry.kelnix.org pointing at this server.

server {
    listen 80;
    listen [::]:80;
    server_name telemetry.kelnix.org;

    # Batched ingest payloads, not file uploads. The API itself caps a batch at
    # 500 items and 2 MB; this is the outer guard.
    client_max_body_size 2m;

    # Ingest is the only endpoint the whole fleet hits, and it is the one a
    # runaway loop in someone else's app could hammer. The API rate-limits per
    # IP too; this stops the traffic before it reaches Node at all.
    location /v1/ingest/ {
        limit_req zone=telemetry_ingest burst=200 nodelay;
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API derives its pseudonymous visitor id from this, so it has to
        # be the real client address rather than 127.0.0.1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# NOTE: the limit_req_zone directive must live in the http{} block, not here.
# Add this line to /etc/nginx/nginx.conf inside http{}:
#
#   limit_req_zone $binary_remote_addr zone=telemetry_ingest:10m rate=50r/s;
