# Build and deploy to GitHub Pages
# Site will be at: https://<username>.github.io/<repo-name>/
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    # The telemetry service deploys to the VPS on its own workflow. A change
    # confined to it has no effect on the static site, so don't rebuild Pages.
    paths-ignore:
      - 'server/**'
      - 'sdk/**'
      - '.github/workflows/deploy-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set Vite base path
        run: |
          echo "VITE_BASE_PATH=/" >> $GITHUB_ENV

      - name: Build
        env:
          # Use / for custom domain or user/organization pages; use /<repo-name>/ for project pages
          VITE_FORMSPREE_ENDPOINT: ${{ secrets.VITE_FORMSPREE_ENDPOINT }}
          # Where /admin talks to, and the public key the first-party page
          # tracker ships with. VITE_* values are inlined at build time, so they
          # have to be set here. The telemetry key is public by design — it can
          # only write events for one app and is revocable from /admin.
          VITE_TELEMETRY_URL: https://telemetry.kelnix.org
          VITE_TELEMETRY_KEY: ${{ secrets.VITE_TELEMETRY_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
